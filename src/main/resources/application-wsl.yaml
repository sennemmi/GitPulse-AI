server:
  port: ${SERVER_PORT:18080}

spring:
  sql:
    init:
      mode: always
  data:
    redis:
      host: 127.0.0.1
      port: 6380
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/agents_proj?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      api-key: ${MODELSCOPE_API_KEY:demo-key}
      base-url: https://api-inference.modelscope.cn
      chat:
        options:
          model: Qwen/Qwen3-30B-A3B-Instruct-2507
          max-tokens: 4096
    mcp:
      client:
        enabled: false

github:
  token: ${GITHUB_TOKEN:}

modelscope:
  api-key: ${MODELSCOPE_API_KEY:demo-key}
  base-url: https://api-inference.modelscope.cn/v1
  image-model: Qwen/Qwen-Image-2512
  poll-interval-ms: 3000
  poll-max-attempts: 2

proxy:
  enabled: false

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: agents-producer-group
    send-message-timeout: 3000

app:
  demo-mode: ${APP_DEMO_MODE:true}
  export-dir: ${APP_EXPORT_DIR:exports}
  radar:
    schedule-enabled: ${RADAR_SCHEDULE_ENABLED:false}
    scan-cron: ${RADAR_SCAN_CRON:0 0 3 * * *}
